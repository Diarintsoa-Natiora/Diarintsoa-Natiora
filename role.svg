<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="Full Stack Developer | Java / Spring Boot Engineer | Backend &amp; Database Architect | Problem Solver" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Full Stack Developer | Java / Spring Boot Engineer | Backend &amp; Database Architect | Problem Solver</title>
  <style>
    text {
      font-family: 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .pill {
      fill: #0d1117;
      stroke: #36BCF7;
      stroke-width: 1.5;
      stroke-opacity: 0.45;
    }
    .role {
      opacity: 0;
      animation: appear 0.7s ease-out forwards;
    }
    .r1 { animation-delay: 0.1s; }
    .r2 { animation-delay: 0.35s; }
    .r3 { animation-delay: 0.6s; }
    .r4 { animation-delay: 0.85s; }

    .glow {
      animation: glow 8s ease-in-out infinite;
    }
    .g1 { animation-delay: 1.5s; }
    .g2 { animation-delay: 3.5s; }
    .g3 { animation-delay: 5.5s; }
    .g4 { animation-delay: 7.5s; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow {
      0%, 20%, 100% { stroke-opacity: 0.45; fill: #0d1117; }
      8%            { stroke-opacity: 1;    fill: #12263a; }
    }
  </style>

  <!-- Role 1 -->
  <g class="role r1">
    <rect class="pill glow g1" x="18" y="12" width="188" height="40" rx="20"/>
    <text x="112" y="33">Full Stack Developer</text>
  </g>

  <!-- Role 2 -->
  <g class="role r2">
    <rect class="pill glow g2" x="220" y="12" width="243" height="40" rx="20"/>
    <text x="341.5" y="33">Java / Spring Boot Engineer</text>
  </g>

  <!-- Role 3 -->
  <g class="role r3">
    <rect class="pill glow g3" x="477" y="12" width="251" height="40" rx="20"/>
    <text x="602.5" y="33">Backend &amp; Database Architect</text>
  </g>

  <!-- Role 4 -->
  <g class="role r4">
    <rect class="pill glow g4" x="742" y="12" width="141" height="40" rx="20"/>
    <text x="812.5" y="33">Problem Solver</text>
  </g>
</svg>
